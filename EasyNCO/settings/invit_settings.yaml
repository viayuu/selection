# https://hydra.cc/docs/configure_hydra/intro/
env:
  _target_: EasyNCO.neural_solvers.envs.TSPEnv
  problem_size: ${scale}
  pomo_size: 1
  aug_type: mix # 'pomo_aug'/'rotate'/'reflect'/'mix'/'noise'
  aug_factor: 16
  mix_prop: 0.5

model:
  _target_: EasyNCO.neural_solvers.methods.INVITPolicy
#  node_dim: 2
  env_name: ${problem}
  embed_dim: 128
  num_heads: 8
  qkv_dim: 16
  feedforward_dim: 512
  action_embed_layer_num: 4
  state_embed_layer_num: 2
  decoder_layer_num: 3
  normalization: 'layer'
  first_placeholder: False
  state_k: [35, 50, 65]
  action_k: 15
  logit_clipping: 10

initialization:
  _target_: EasyNCO.neural_solvers.pipeline.ARInitialization

iteration:
  _target_: EasyNCO.neural_solvers.pipeline.NoIteration

module:
  _target_: EasyNCO.phases.ARREINFORCELightning
  method_name: ${model}
  baseline: 'shared'
  problem_size: ${scale}
  batch_size: ${batch_size}
  episodes: ${episodes}
  val_episode: ${val_episode}
  optimizer_type: 'Adam' # 'Adam', 'AdamW'
  scheduler_type: null #'ExponentialLR', 'MultiStepLR'
  optimizer_params: {
    'optimizer': {
        'lr': 1e-4,
        'weight_decay': 1e-6
    },
#    'scheduler': {
#        'milestones': [501,],
#        'gamma': 0.1
#    }
  }
  decoder_strategy: ${decoder_strategy}
  every_n_steps_output: 100 # output log every n steps (i.e., batch)

model_checkpoint:
  #_target_: lightning.pytorch.callbacks.ModelCheckpoint
  _target_: EasyNCO.utils.utils.CustomModelCheckpoint
  dirpath: checkpoints
  filename: ${model}_${problem}${scale}_{epoch:02d}
  save_top_k: ${save_top_k}
  every_n_epochs: ${every_n_epochs}

trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: ${max_epochs} # max epochs
  reload_dataloaders_every_n_epochs: 1 # RL: 1, SL: 0
  log_every_n_steps: ${log_every_n_steps} # log every n steps
  precision: ${precision}
  enable_progress_bar: ${enable_progress_bar} # disable progress bar
  gradient_clip_val: 1.0

test_loader:
  model_dirpath: pretrained
#  model_filename: ${model}_${problem}${scale}_epoch04.ckpt # model trained by EasyNCO
#  model_filename: checkpoint_24-04-24--14-34-54-n100-gpu0.pkl # tsp
  model_filename: invit_cvrp100.ckpt
#  model_filename: checkpoint_24-04-18--14-14-20-n100-gpu0.pkl # cvrp
