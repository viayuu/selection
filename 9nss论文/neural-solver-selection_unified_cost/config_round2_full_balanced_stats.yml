name: round2_full_balanced_stats
cuda_device_num: 1
seed: 2024
train_params:
  num_epochs: 5
  train_batch_size: 128
  test_batch_size: 256
  learning_rate: 0.0001
  weight_decay: 0.000001
  loss: rank
  rank_steps:
  eval_top_k: 4
  data_aug: false
  num_workers: 0
  pin_memory: true
  prefetch_factor: 2
  save_every_epoch: true
  problem_balanced_sampling: true
  train_epoch_size_multiplier: 1.0
  selection_metric: val_macro_problem_oracle_ratio
data_params:
  export_root: ../../easynco_v3_bridge/exports/nss_like_export_v1
  node_feature_dim: 12
  instance_stats_dim: 10
  split_missing_from_train:
    seed: 2024
    val_ratio: 0.1
    test_ratio: 0.1
model_params:
  pooling: true
  downsample_ratio: 0.8
  embedding_dim: 128
  encoder_layer_num: 2
  block_num: 2
  head_num: 8
  qkv_dim: 16
  ff_hidden_dim: 512
  norm: rezero
  use_instance_stats: true
  use_film: true
  use_solver_interaction: true
