mode: test
model: reld
problem: cvrp
scale: 200
num_job: 20
num_machine: 20
decoder_strategy: greedy
cuda:
- 0
max_epochs: 90
batch_size: 128
episodes: 128
val_episode: 128
val_data_path: test_dataset_vrp_uniform/test_vrp200_capacity80_nums128_uniform.pt
test_data_path: test_dataset_vrp_uniform/test_vrp200_capacity80_nums128_uniform.pt
train_data_path: null
varying_data_params:
  distribution_list:
  - uniform
  use_triangular_capacity: true
  triangular_params:
  - 3
  - 6
  - 25
  capacity_range:
  - 80
  - 80
seed: 1234
disable_gpu: false
strategy: auto
matmul_precision: medium
precision: 32-true
enable_progress_bar: false
log_every_n_steps: 1
ckpt_path: null
save_top_k: -1
every_n_epochs: 1
dir: ./results/${mode}/${model}_${problem}/${now:%Y-%m-%d}-${now:%H-%M-%S}_${model}_${problem}_${scale}_${mode}
logger:
  _target_: lightning.pytorch.loggers.TensorBoardLogger
  save_dir: tensorboard
  name: null
  log_graph: false
  default_hp_metric: true
  prefix: ''
settings:
  env:
    _target_: EasyNCO.neural_solvers.envs.CVRPEnv
    problem_size: ${scale}
    pomo_size: 100
    aug_type: pomo_aug
    aug_factor: 8
  model:
    _target_: EasyNCO.neural_solvers.methods.ReLDPolicy
    env_name: ${problem}
    embed_dim: 128
    num_heads: 8
    qkv_dim: 16
    num_encoder_layers: 6
    normalization: null
    feedforward_hidden: 512
    logit_clipping: 50
    use_graph_mean: false
    am_mode: true
    first_placeholder: false
    first_mode: random
  initialization:
    _target_: EasyNCO.neural_solvers.methods.ReLDInitialization
  iteration:
    _target_: EasyNCO.neural_solvers.pipeline.NoIteration
  module:
    _target_: EasyNCO.phases.ARREINFORCELightning
    method_name: ReLDPolicy
    baseline: shared
    problem_size: ${scale}
    batch_size: ${batch_size}
    episodes: ${episodes}
    val_episode: ${val_episode}
    optimizer_type: Adam
    scheduler_type: MultiStepLR
    varying_data_params: ${varying_data_params}
    train_data_params: ${varying_data_params}
    optimizer_params:
      optimizer:
        lr: 0.0001
        weight_decay: 0
      scheduler:
        milestones:
        - 70
        - 80
        gamma: 0.1
    decoder_strategy: ${decoder_strategy}
    every_n_steps_output: 100
  model_checkpoint:
    _target_: EasyNCO.utils.utils.CustomModelCheckpoint
    dirpath: checkpoints
    filename: reld_cvrp_${scale}_{epoch:02d}
    save_top_k: ${save_top_k}
    every_n_epochs: ${every_n_epochs}
  trainer:
    _target_: lightning.pytorch.Trainer
    max_epochs: ${max_epochs}
    reload_dataloaders_every_n_epochs: 1
    log_every_n_steps: ${log_every_n_steps}
    precision: ${precision}
    enable_progress_bar: ${enable_progress_bar}
    gradient_clip_val: 1.0
  test_loader:
    model_dirpath: pretrained
    model_filename: model_epoch_90.pt
