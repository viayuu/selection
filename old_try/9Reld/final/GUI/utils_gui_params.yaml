matnet:
    atsp:
        train:
            model.num_encoder_layers: 5
            module.train_data_params: { "int_min": 0, "int_max": 1000000, "scaler": 1000000 }
        test:
            model.num_encoder_layers: 5
            module.train_data_params: { "int_min": 0, "int_max": 1000000, "scaler": 1000000 }
            cfg.decoder_strategy: sampling
    ffsp:
        train:
            model.num_encoder_layers: 3
            machine_cnt_list: [4, 4, 4]
            time_low: 2
            time_high: 10
            module.initialization_params: { "pomo_size": 24 }
            env.pomo_size: 24
        test:
            model.num_encoder_layers: 3
            env.machine_cnt_list: [4, 4, 4]
            env.pomo_size: 24
            time_low: 2
            time_high: 10
            module.initialization_params: { "pomo_size": 24 }
            cfg.decoder_strategy: sampling



