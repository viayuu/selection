# 属于settings.yaml参数

# 示例1
# 例如在原yaml中
# model：
#  num_heads: 8


# module:
# optimizer_params: {
#    'optimizer': {
#        'lr': 1e-4,
#        'weight_decay': 1e-6
#    },
# 

# 在Model_dict写成
# model.num_heads: 8
# module.optimizer_params.optimizer.lr: 1e-4


# 示例2
# 如果train和test的参数不一致，则写成
# train:
#   settings.model.num_heads: 8
# test: 
#   settings.model.num_heads: 4
# 


# 示例3
# 如果在该问题下，没有需要在setting修改的参数，则写成None，例如pomo-tsp
# tsp: None



# 属于config的参数

# 示例4
# 如果参数在config
# cfg.decoder_strategy:  sampling 





