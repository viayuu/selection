glop:
    tsp:
        model.global_params.width: 10
        model.global_params.n_subset: 1
        model.global_params.revision_lens: [ 100,50,20 ]
        model.global_params.iter: [ 20,25,5]
    cvrp:
        cfg.batch_size: 1
        model.global_params.width: 1
        model.global_params.n_subset: 1
        model.global_params.revision_lens: [50,20]
        model.global_params.iter: [10,5]
        model.upper.units: 48
        model.upper.feats: 3
        model.upper.k_sparse_cvrp_leq1000: 100
        model.upper.k_sparse_cvrp_gt1000: 200
        model.upper.edge_feats: 2
        model.upper.depth: 12
    pctsp:
        model.global_params.width: 1
        model.global_params.n_subset: 10
        model.global_params.revision_lens: [ 100,50,20 ]
        model.global_params.iter: [10,10,5 ]
        model.upper.units: 32
        model.upper.feats: 2
        model.upper.k_sparse_pctsp_leq500: 50
        model.upper.k_sparse_pctsp_leq1000: 100
        model.upper.k_sparse_pctsp_gt1000: 200
        model.upper.edge_feats: 1
        model.upper.depth: 12

    atsp:
        cfg.decoder_strategy:  sampling
        cfg.batch_size: 1
        model.global_params.revision_lens: [50]
        model.global_params.iter: [3]



