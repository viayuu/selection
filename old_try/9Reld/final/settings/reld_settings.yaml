env:
  _target_: EasyNCO.neural_solvers.envs.CVRPEnv
  problem_size: ${scale}
  pomo_size: 100          # 保持POMO的并行轨迹机制
  aug_type: pomo_aug           # 使用POMO的数据增强
  aug_factor: 1                # augx 8: 8倍数据增强
  # # 论文数据分布设置
  # data_distribution: "uniform_40_100"  # 论文: Uniform(40, 100)
  # capacity_mode: "triangular_3_6_25"   # 论文: T(3,6,25)

model:
  _target_: EasyNCO.neural_solvers.methods.ReLDPolicy
  env_name: ${problem}
  embed_dim: 128
  num_heads: 8
  qkv_dim: 16
  num_encoder_layers: 6
  normalization: null          # ReLD核心改进：移除归一化层
  feedforward_hidden: 512
  logit_clipping: 50           # ReLD使用更大的截断值
  use_graph_mean: false        # ReLD不使用图均值
  am_mode: true
  first_placeholder: false     # ReLD不使用first placeholder
  first_mode: 'random'         # 随机选择起始节点

initialization:
  _target_: EasyNCO.neural_solvers.methods.ReLDInitialization

iteration:
  _target_: EasyNCO.neural_solvers.pipeline.NoIteration

module:
  _target_: EasyNCO.phases.ARREINFORCELightning
  method_name: ReLDPolicy
  baseline: 'shared'           # ReLD使用Shared Baseline（与POMO一致）
  problem_size: ${scale}
  batch_size: ${batch_size}            # 论文设置：batch size 120
  episodes: ${episodes}         # 论文设置：每epoch 600,000实例
  val_episode: ${val_episode}      # 验证集大小
  optimizer_type: 'Adam'
  scheduler_type: 'MultiStepLR'  # 平台支持的调度器：第70、80轮衰减0.1倍
  varying_data_params: ${varying_data_params}
  train_data_params: ${varying_data_params}
  optimizer_params: {
    'optimizer': {
        'lr': 1e-4,            # 论文设置：Adam初始学习率
        'weight_decay': 0      # 论文设置：权重衰减为0
    },
    'scheduler': {
        'milestones': [70, 80],  # 论文：第70、80轮衰减
        'gamma': 0.1           # 衰减0.1倍
    }
  }
  decoder_strategy: ${decoder_strategy}
  every_n_steps_output: 100

model_checkpoint:
  _target_: EasyNCO.utils.utils.CustomModelCheckpoint
  dirpath: checkpoints
  filename: reld_cvrp_${scale}_{epoch:02d}
  save_top_k: ${save_top_k}
  every_n_epochs: ${every_n_epochs}

trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: ${max_epochs}          # 论文设置：训练90轮
  reload_dataloaders_every_n_epochs: 1  # RL: 1, SL: 0
  log_every_n_steps: ${log_every_n_steps}
  precision: ${precision}
  enable_progress_bar: ${enable_progress_bar}
  gradient_clip_val: 1.0

test_loader:
  model_dirpath: pretrained
  model_filename: model_epoch_90.pt 