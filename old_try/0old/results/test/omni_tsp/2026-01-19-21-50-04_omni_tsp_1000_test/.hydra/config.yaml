sandbox: false
sandbox_test_batch:
  _target_: EasyNCO.sandbox.test_batch.BQTestBatch
mode: test
model: omni
problem: tsp
scale: 1000
num_job: 20
num_machine: 20
decoder_strategy: greedy
cuda:
- 0
max_epochs: 5
batch_size: 4
episodes: 2000
val_episode: 128
val_data_path: test_dataset_tsp_uniform/test_tsp200_nums128_uniform.pt
test_data_path: cross_distribution/tsp1000_explosion.pkl
train_data_path: null
varying_data_params:
  scale_range: null
  distribution_list:
  - uniform
  - cluster
  capacity_range:
  - 50
  - 100
seed: 1234
disable_gpu: false
strategy: auto
matmul_precision: medium
precision: 32-true
enable_progress_bar: false
log_every_n_steps: 1
ckpt_path: null
save_top_k: -1
every_n_epochs: 1
dir: ./results/${mode}/${model}_${problem}/${now:%Y-%m-%d}-${now:%H-%M-%S}_${model}_${problem}_${scale}_${mode}
logger:
  _target_: lightning.pytorch.loggers.TensorBoardLogger
  save_dir: tensorboard
  name: null
  log_graph: false
  default_hp_metric: true
  prefix: ''
settings:
  env:
    _target_: EasyNCO.neural_solvers.envs.CVRPEnv
    problem_size: ${scale}
    pomo_size: ${scale}
    aug_type: pomo_aug
    aug_factor: 8
  model:
    _target_: EasyNCO.neural_solvers.methods.OMNI_POMO_Policy
    env_name: ${problem}
    num_heads: 8
    qkv_dim: 16
    num_encoder_layers: 6
    normalization: batch_no_track
    feedforward_hidden: 512
    logit_clipping: 10
    use_graph_mean: false
    am_mode: false
    first_placeholder: false
    first_mode: random
  initialization:
    _target_: EasyNCO.neural_solvers.methods.OMNIInitialization
  fine_tune_initialization:
    _target_: EasyNCO.neural_solvers.methods.POMOInitialization
  iteration:
    _target_: benchmarks.easynco_init_only_iteration.InitOnlyIteration
  module:
    _target_: EasyNCO.phases.ARREINFORCELightning
    method_name: ${model}
    baseline: shared
    problem_size: ${scale}
    batch_size: ${batch_size}
    episodes: ${episodes}
    aug_type: pomo_aug
    optimizer_type: Adam
    scheduler_type: null
    optimizer_params:
      optimizer:
        lr: 0.0001
        weight_decay: 1.0e-06
    decoder_strategy: ${decoder_strategy}
    every_n_steps_output: 2
    mode: ${mode}
    fine_tune:
      enable: false
      fine_tune_episodes: 1000
      k: 1
      augmentation_enable: false
      fine_tune_batch_size: 10
      optimizer:
        lr: 1.0e-05
        weight_decay: 1.0e-06
    initialization_params:
      meta_params:
        meta_method: maml_fomaml
        data_type: size_distribution
        switch_epochs: 50000
        B: 1
        k: 1
        meta_batch_size: 64
        update_weight: 100
        sch_epoch: 225000
        solver: lkh3_offline
        beta: 0.9
  model_checkpoint:
    _target_: EasyNCO.utils.utils.CustomModelCheckpoint
    dirpath: checkpoints
    filename: ${model}_${problem}${scale}_{epoch:02d}
    save_top_k: ${save_top_k}
    every_n_epochs: ${every_n_epochs}
  trainer:
    _target_: lightning.pytorch.Trainer
    max_epochs: ${max_epochs}
    reload_dataloaders_every_n_epochs: 1
    log_every_n_steps: ${log_every_n_steps}
    precision: ${precision}
    enable_progress_bar: ${enable_progress_bar}
  test_loader:
    model_dirpath: pretrained
    model_filename: omni_tsp_maml_fomaml.ckpt
