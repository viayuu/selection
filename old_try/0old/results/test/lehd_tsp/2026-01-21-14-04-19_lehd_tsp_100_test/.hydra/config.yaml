sandbox: false
sandbox_test_batch:
  _target_: EasyNCO.sandbox.test_batch.BQTestBatch
mode: test
model: lehd
problem: tsp
scale: 100
num_job: 20
num_machine: 20
decoder_strategy: greedy
cuda:
- 0
max_epochs: 5
batch_size: 32
episodes: 10000
val_episode: 128
val_data_path: test_dataset_tsp_uniform/test_tsp200_nums128_uniform.pt
test_data_path: tsplib/tsplib
train_data_path: null
varying_data_params:
  scale_range: null
  distribution_list:
  - uniform
  - cluster
  capacity_range:
  - 50
  - 100
seed: 1234
disable_gpu: false
strategy: auto
matmul_precision: medium
precision: 32-true
enable_progress_bar: false
log_every_n_steps: 1
ckpt_path: null
save_top_k: -1
every_n_epochs: 1
dir: ./results/${mode}/${model}_${problem}/${now:%Y-%m-%d}-${now:%H-%M-%S}_${model}_${problem}_${scale}_${mode}
logger:
  _target_: lightning.pytorch.loggers.TensorBoardLogger
  save_dir: tensorboard
  name: null
  log_graph: false
  default_hp_metric: true
  prefix: ''
settings:
  env:
    _target_: EasyNCO.neural_solvers.envs.TSPEnv
    problem_size: ${scale}
    pomo_size: 1
    aug_type: pomo_aug
    aug_factor: 8
    method_name: ${model}
    use_flag_to_indicate_depot: true
  model:
    _target_: EasyNCO.neural_solvers.methods.LEHDPolicy
    env_name: ${problem}
    phase: ${mode}
    layer_num: 6
    node_dim: 2
    embed_dim: 128
    num_heads: 8
    qkv_dim: 16
    feedforward_hidden: 512
    normalization: None
    first_mode: random
  initialization:
    _target_: EasyNCO.neural_solvers.methods.LEHDInitialization
  iteration:
    _target_: EasyNCO.neural_solvers.methods.LEHDIteration
  module:
    _target_: EasyNCO.phases.ARREINFORCELightning
    method_name: ${model}
    baseline: shared
    problem_size: ${scale}
    batch_size: ${batch_size}
    episodes: ${episodes}
    val_episode: ${val_episode}
    optimizer_type: Adam
    scheduler_type: null
    optimizer_params:
      optimizer:
        lr: 0.0001
        weight_decay: 1.0e-06
    decoder_strategy: ${decoder_strategy}
    every_n_steps_output: 100
    iteration_params:
      max_steps: 0
  model_checkpoint:
    _target_: EasyNCO.utils.utils.CustomModelCheckpoint
    dirpath: checkpoints
    filename: ${model}_${problem}${scale}_{epoch:02d}
    save_top_k: ${save_top_k}
    every_n_epochs: ${every_n_epochs}
  trainer:
    _target_: lightning.pytorch.Trainer
    max_epochs: ${max_epochs}
    reload_dataloaders_every_n_epochs: 1
    log_every_n_steps: ${log_every_n_steps}
    precision: ${precision}
    enable_progress_bar: ${enable_progress_bar}
    gradient_clip_val: 1.0
  test_loader:
    model_dirpath: pretrained
    model_filename: lehd_tsp100.ckpt
