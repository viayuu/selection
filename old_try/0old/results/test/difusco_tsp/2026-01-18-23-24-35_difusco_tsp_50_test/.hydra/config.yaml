sandbox: false
sandbox_test_batch:
  _target_: EasyNCO.sandbox.test_batch.BQTestBatch
mode: test
model: difusco
problem: tsp
scale: 50
num_job: 20
num_machine: 20
decoder_strategy: greedy
cuda:
- 0
max_epochs: 5
batch_size: 1
episodes: 10
val_episode: 128
val_data_path: test_dataset_tsp_uniform/test_tsp200_nums128_uniform.pt
test_data_path: tsplib/tsplib
train_data_path: null
varying_data_params:
  scale_range: null
  distribution_list:
  - uniform
  - cluster
  capacity_range:
  - 50
  - 100
seed: 1234
disable_gpu: false
strategy: auto
matmul_precision: medium
precision: 32-true
enable_progress_bar: false
log_every_n_steps: 1
ckpt_path: null
save_top_k: -1
every_n_epochs: 1
dir: ./results/${mode}/${model}_${problem}/${now:%Y-%m-%d}-${now:%H-%M-%S}_${model}_${problem}_${scale}_${mode}
logger:
  _target_: lightning.pytorch.loggers.TensorBoardLogger
  save_dir: tensorboard
  name: null
  log_graph: false
  default_hp_metric: true
  prefix: ''
settings:
  env:
    _target_: EasyNCO.neural_solvers.envs.TSPEnv
    problem_size: ${scale}
    pomo_size: 1
    aug_type: pomo_aug
    aug_factor: 1
    use_graph: true
    env_name: ${problem}
  model:
    _target_: EasyNCO.neural_solvers.methods.DIFUSCOPolicy
    env_name: ${problem}
    n_layers: 12
    hidden_dim: 256
    aggregation: sum
    diffusion_type: gaussian
    diffusion_schedule: linear
    diffusion_steps: 1000
    sparse_factor: -1
    node_feature_only: true
    use_activation_checkpoint: false
    parallel_sampling: 1
    sequential_sampling: 1
    inference_diffusion_steps: 20
    inference_schedule: cosine
    inference_trick: ddim
  initialization:
    _target_: EasyNCO.neural_solvers.methods.DIFUSCOInitialization
  iteration:
    _target_: EasyNCO.neural_solvers.methods.DIFUSCOIteration
  module:
    _target_: EasyNCO.phases.ARREINFORCELightning
    problem: ${problem}
    method_name: ${model}
    baseline: null
    problem_size: ${scale}
    batch_size: ${batch_size}
    episodes: ${episodes}
    val_episode: ${val_episode}
    optimizer_type: Adam
    scheduler_type: null
    optimizer_params:
      optimizer:
        lr: 0.0001
        weight_decay: 1.0e-06
    decoder_strategy: ${decoder_strategy}
    every_n_steps_output: 100
    initialization_params:
      heatmap_path: null
    iteration_params:
      max_steps: 10
    train_data_params:
      graph: true
    test_data_params:
      graph: true
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: checkpoints
    filename: ${model}_${problem}${scale}_{epoch:02d}
    save_top_k: ${save_top_k}
    every_n_epochs: ${every_n_epochs}
  trainer:
    _target_: lightning.pytorch.Trainer
    max_epochs: ${max_epochs}
    reload_dataloaders_every_n_epochs: 0
    log_every_n_steps: ${log_every_n_steps}
    precision: ${precision}
    enable_progress_bar: ${enable_progress_bar}
    gradient_clip_val: 1.0
  test_loader:
    model_dirpath: pretrained
    model_filename: difusco_tsp100.ckpt
