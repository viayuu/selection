# Minimal composition setting:
# - GLOPInitialization (GLOPPolicy  + glop_policy_tsp.pt)
# - LEHDIteration      (LEHDPolicy + lehd_tsp100.ckpt)
#
# Use with:
#   python EasyNCO/eval.py settings=glop_init_lehd_iter_settings mode=test model=compose problem=tsp ...

env:
  _target_: EasyNCO.neural_solvers.envs.TSPEnv
  problem_size: ${scale}
  pomo_size: 1
  aug_type: null
  aug_factor: 1
  method_name: glop_init_lehd_iter

init_model:
  _target_: EasyNCO.neural_solvers.methods.GLOPPolicy
  problem: ${problem}
  global_params:
    width: 1
    n_subset: 1
    revision_lens: [ 100,50,20 ]
    iter: [ 20,25,5 ]
  lower:
    env_name: "tsp"
    num_heads: 8
    qkv_dim: 16
    num_encoder_layers: 6
    normalization: "batch"
    feedforward_hidden: 512
    logit_clipping: 10
    use_graph_mean: true
    am_mode: false
    first_placeholder: true
    sub_glop: true
    bias: false
    bias_k: false
    bias_v: false
    bias_combine: false

iter_model:
  _target_: EasyNCO.neural_solvers.methods.LEHDPolicy
  env_name: ${problem}
  phase: ${mode}
  layer_num: 6
  node_dim: 2
  embed_dim: 128
  num_heads: 8
  qkv_dim: 16
  feedforward_hidden: 512
  normalization: null
  first_mode: random

init_model_name: glop
iter_model_name: lehd

init_test_loader:
  model_dirpath: pretrained
  model_filename: glop_policy_tsp.pt

iter_test_loader:
  model_dirpath: pretrained
  model_filename: lehd_tsp100.ckpt

initialization:
  _target_: EasyNCO.neural_solvers.methods.GLOPInitialization
  problem: ${problem}

iteration:
  _target_: EasyNCO.neural_solvers.methods.LEHDIteration

module:
  _target_: EasyNCO.phases.ARREINFORCELightning
  method_name: glop_init_lehd_iter
  baseline: shared
  problem_size: ${scale}
  batch_size: ${batch_size}
  episodes: ${episodes}
  val_episode: ${val_episode}
  optimizer_type: Adam
  scheduler_type: null
  optimizer_params:
    optimizer:
      lr: 1e-4
      weight_decay: 1e-6
  decoder_strategy: ${decoder_strategy}
  every_n_steps_output: 100
  iteration_params:
    max_steps: 1000

trainer:
  _target_: lightning.pytorch.Trainer
  max_epochs: ${max_epochs}
  reload_dataloaders_every_n_epochs: 1
  log_every_n_steps: ${log_every_n_steps}
  precision: ${precision}
  enable_progress_bar: ${enable_progress_bar}

