hydra:
  run:
    dir: ${dir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra: []
    task:
    - mode=test
    - model=glop
    - problem=cvrp
    - decoder_strategy=greedy
    - settings=glop_settings
    - test_data_path=cvrplib/Vrp-Set-X
    - varying_data_params.capacity_range=null
    - settings.test_loader.model_dirpath=pretrained
    - settings.test_loader.model_filename=glop_policy_cvrp_1000.pt
    - batch_size=1
    - dir=./results/experiments/cvrplib/glopvrp_set_x
  job:
    name: eval
    override_dirname: batch_size=1,decoder_strategy=greedy,dir=./results/experiments/cvrplib/glopvrp_set_x,mode=test,model=glop,problem=cvrp,settings.test_loader.model_dirpath=pretrained,settings.test_loader.model_filename=glop_policy_cvrp_1000.pt,settings=glop_settings,test_data_path=cvrplib/Vrp-Set-X,varying_data_params.capacity_range=null
    id: ???
    num: ???
    config_name: configs.yaml
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.1.1
    cwd: /public/home/zhoucl/shiys/tmp
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /public/home/zhoucl/shiys/tmp/EasyNCO
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    choices:
      settings: glop_settings
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
