# https://hydra.cc/docs/configure_hydra/intro/
# flexible composition of configurations
# you can use this file to compose different modules from different solvers
# Whatever combination you want, just place the corresponding configuration file here
# and modify the corresponding Initialization and Iteration classes.
env:
  _target_: EasyNCO.neural_solvers.envs.TSPEnv
  problem_size: ${scale}
  pomo_size: ${scale}
  aug_type: pomo_aug # 'pomo_aug'/'rotate'/'reflect'/'mix'/'noise'
  aug_factor: 8

model:
  _target_: EasyNCO.neural_solvers.methods.LEHDPolicy
  env_name: ${problem}
  phase: ${mode}
  layer_num: 6
  node_dim: 2
  embed_dim: 128
  num_heads: 8
  qkv_dim: 16
  feedforward_hidden: 512
  normalization: None
  first_mode: 'random'

global_params: &global_params
  width: 1
  n_subset: 1
  revision_lens: [50]
  iter: [3]

initialization:
  _target_: EasyNCO.neural_solvers.methods.RIInitialization
  problem: ${problem}
  params: *global_params

iteration:
  _target_: EasyNCO.neural_solvers.methods.TSPLEHDIteration

module:
  _target_: EasyNCO.phases.ARREINFORCELightning #
  method_name: ${model}
  problem_size: ${scale}
  batch_size: ${batch_size}
  episodes: ${episodes}
  decoder_strategy: ${decoder_strategy}
  iteration_params:
    max_steps: 10 # max steps for each episode, used for iteration

trainer:
  _target_: lightning.pytorch.Trainer
  precision: ${precision}
  enable_progress_bar: ${enable_progress_bar} # disable progress bar

test_loader:
  model_dirpath: pretrained
  model_filename: lehd_tsp100.ckpt
