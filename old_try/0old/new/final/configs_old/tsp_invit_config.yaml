# @package _global_


defaults:
  - _self_

env:
  _target_: EasyNCO.methods.envs.TSPEnv
  problem_size: 100
  pomo_size: 1
  method_name: 'invit'
  aug_type: 'mix'
  aug_factor: 16
  mix_prop: 0.5

model:
  _target_: EasyNCO.methods.operators.neural_operators.INVITPolicy
  node_dim: 2
  env_name: 'tsp'
  embed_dim: 128
  num_heads: 8
  qkv_dim: 16
  feedforward_dim: 512
  action_embed_layer_num: 2
  state_embed_layer_num: 2
  decoder_layer_num: 3
  normalization: 'layer'
  first_placeholder: False
  field: [15, 35, 50]
  logit_clipping: 10

module:
  _target_: EasyNCO.phases.train.rl.REINFORCELightning
  baseline: 'rollout'
  problem_size: ${env.problem_size}
  batch_size: 8
  train_episodes: 38400
  first_mode: 'random'
  val_aug_flag: True
  val_data_size: 128
  val_batch_size: 8
  optimizer_type: 'AdamW'
  scheduler_type: 'ExponentialLR'
  optimizer_params: {'optimizer': {
        'lr': 1e-4
        #'weight_decay': 1e-2
    },
    'scheduler': {
        'gamma': 0.99
    }
  }

#The most important hyperparameter to use is `reload_dataloaders_every_n_epochs`.
#This allows for datasets to be re-created on the run and distributed by Lightning across
#devices on each epoch. Setting to a value different than 1 may lead to overfitting to a
#specific (such as the initial) data distribution.
trainer:
  _target_: EasyNCO.phases.train.rl.RLTrainer
  max_epochs: 250
  reload_dataloaders_every_n_epochs: 1
  log_every_n_steps: 1
  accelerator: 'gpu'
  num_nodes: 1 # Number of gpu nodes for distributed training


# https://www.tensorflow.org/tensorboard/
#Solve the error: ImportError: cannot import name ‘notf‘ from ‘tensorboard.compat‘
#Solution: Uninstall tensorflow and tensorboard(including all affiliated libraries)
# and only install tensorboard if you are using pytorch.
logger:
  _target_: lightning.pytorch.loggers.TensorBoardLogger
  save_dir: "tensorboard_log/"
  name: null
  log_graph: False
  default_hp_metric: True
  prefix: ""


model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: 'checkpoints_debug/'
  filename: 'invit-{epoch:02d}'
  save_top_k: -1 # 保存所有检查点
  every_n_epochs: 1 # 每1轮保存一次,

#custom_progressBar:
#  _target_: EasyNCO.phases.single_obj.CustomProgressBar

tester:
  _target_: EasyNCO.phases.eval.EVALUATELightning


test_loader:
  model_dirpath : "/data/"
  model_filename: 'raw_invit_model.pt'
  data_dict : {
                      use_customized_data : False,
                      data_path : "/data/datasets/test_dataset_tsp_uniform/test_tsp200_nums128_uniform.pt"
  }
  test_params: {
                 'test_episodes' : 128,
                 'test_batch_size' : 8,
                 'test_strategy' : 'greedy'
                 }

test_env:
  _target_: EasyNCO.methods.envs.TSPEnv
  problem_size: 100
  pomo_size: 1
  method_name: 'invit'
  aug_type: 'mix'
  aug_factor: 16
  mix_prop: 0.5