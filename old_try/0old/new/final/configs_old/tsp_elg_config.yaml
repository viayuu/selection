# @package _global_


defaults:
  - _self_

env:
  _target_: EasyNCO.methods.envs.TSPEnv
  problem_size: 50
  pomo_size: ${env.problem_size}
  method_name: 'elg'

model:
  _target_: EasyNCO.methods.operators.neural_operators.ELGPolicy
  elg_local_params: {
                      'local_enable' : False,
                      'use_local' : True,
                      'is_joint' : True,
                      'local_size' : 30,
                      'xi' : -1,
                      'euclidean' : False,
  }
  env_name: 'tsp'
  num_heads: 8
  qkv_dim: 16
  num_encoder_layers: 6
  normalization: 'instance'
  feedforward_hidden: 512
  logit_clipping: 10
  use_graph_mean: False
  am_mode: False
  first_placeholder: False


module:
  _target_: EasyNCO.phases.train.rl.REINFORCELightning
  baseline: 'shared'
  problem_size: ${env.problem_size}
  batch_size: 32
  train_episodes: 320
  first_mode: 'random'
  optimizer_params: {'optimizer': {
        'lr': 1e-4,
        'weight_decay': 1e-6
    },
#    'scheduler': {
#        'milestones': [501,],
#        'gamma': 0.1
#    }
  }
  elg_start_step: 2

#The most important hyperparameter to use is `reload_dataloaders_every_n_epochs`.
#This allows for datasets to be re-created on the run and distributed by Lightning across
#devices on each epoch. Setting to a value different than 1 may lead to overfitting to a
#specific (such as the initial) data distribution.
trainer:
  _target_: EasyNCO.phases.train.rl.RLTrainer
  max_epochs: 5
  reload_dataloaders_every_n_epochs: 1
  log_every_n_steps: 1
  accelerator: 'gpu'
  num_nodes: 1 # Number of gpu nodes for distributed training


# https://www.tensorflow.org/tensorboard/
#Solve the error: ImportError: cannot import name ‘notf‘ from ‘tensorboard.compat‘
#Solution: Uninstall tensorflow and tensorboard(including all affiliated libraries)
# and only reinstall tensorboard if you are using pytorch.
logger:
  _target_: lightning.pytorch.loggers.TensorBoardLogger
  save_dir: "tensorboard_log/"
  name: null
  log_graph: False
  default_hp_metric: True
  prefix: ""


model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: 'checkpoints_debug/'
  filename: 'elg-{epoch:02d}'
  save_top_k: -1 # 保存所有检查点
  every_n_epochs: 1 # 每1轮保存一次,


tester:
  _target_: EasyNCO.phases.eval.EVALUATELightning


test_loader:
  model_dirpath : "/phases/train/outputs/2024-10-15/15-29-36/checkpoints_debug/"
  model_filename: 'elg-epoch=04.ckpt'
  data_dict : {
                      use_customized_data : True,
                      data_path : "/data/datasets/test_dataset_tsp_uniform/test_tsp200_nums128_uniform.pt"
  }
  test_params: {
                 'test_episodes' : 10000,
                 'test_batch_size' : 1000,
                 'test_strategy' : 'greedy',
                 'augmentation' : {
                                    'enable' : False,
                                    'aug_factor' : 1
                 }
  }

test_env:
  _target_: EasyNCO.methods.envs.TSPEnv
  problem_size: 100
  pomo_size: ${env.problem_size}
  method_name: 'elg'



