sandbox: false
sandbox_test_batch:
  _target_: EasyNCO.sandbox.test_batch.BQTestBatch
mode: test
model: htsp
problem: tsp
scale: 1000
num_job: 20
num_machine: 20
decoder_strategy: greedy
cuda:
- 0
max_epochs: 5
batch_size: 32
episodes: 10000
val_episode: 128
val_data_path: test_dataset_tsp_uniform/test_tsp200_nums128_uniform.pt
test_data_path: tsplib/tsplib
train_data_path: null
varying_data_params:
  scale_range: null
  distribution_list:
  - uniform
  - cluster
  capacity_range:
  - 50
  - 100
seed: 1234
disable_gpu: false
strategy: auto
matmul_precision: medium
precision: 32-true
enable_progress_bar: false
log_every_n_steps: 1
ckpt_path: null
save_top_k: -1
every_n_epochs: 1
dir: ./results/${mode}/${model}_${problem}/${now:%Y-%m-%d}-${now:%H-%M-%S}_${model}_${problem}_${scale}_${mode}
logger:
  _target_: lightning.pytorch.loggers.TensorBoardLogger
  save_dir: tensorboard
  name: null
  log_graph: false
  default_hp_metric: true
  prefix: ''
settings:
  env:
    _target_: EasyNCO.neural_solvers.envs.TSPEnv
    problem_size: ${scale}
    pomo_size: ${scale}
    aug_type: pomo_aug
    aug_factor: 1
  model:
    _target_: EasyNCO.neural_solvers.methods.HTSPPolicy
    env_name: ${problem}
    Encoder:
      input_dim: 8
      embedding_dim: 128
    Actor:
      state_dim: 128
      mid_dim: 128
      action_dim: 2
      init_a_std_log: -1
    Critic:
      state_dim: 128
      mid_dim: 512
      _action_dim: 2
    low_level_type: pomo
    low_level:
      low_level_buffer_size: 10000
      frag_len: 200
      node_dim: 2
      group_size: 200
      update_time: None
      lower_path: /pretrained/htsp_lower_tsp.ckpt
    low_env:
      k: 40
      frag_len: 200
      max_new_nodes: 190
      max_improvement_step: 0
      auto_reset: false
      no_depot: false
    target_step: 64
    reward_scale: 1.0
    gamma: 1.0
    experience_items: 6
    env_num: 64
    grad_method: norm
    lambda_GAE: 0.9
    data_augment: false
    eval:
      time_limit: 100.0
      batch_size: 16
      improvement_step: 0
  initialization:
    _target_: EasyNCO.neural_solvers.methods.HTSPInitialization
  iteration:
    _target_: EasyNCO.neural_solvers.pipeline.NoIteration
  module:
    _target_: EasyNCO.phases.ARREINFORCELightning
    method_name: ${model}
    baseline: shared
    problem_size: ${scale}
    batch_size: ${batch_size}
    episodes: ${episodes}
    val_episode: ${val_episode}
    optimizer_type: Adam
    scheduler_type: null
    optimizer_params:
      optimizer:
        lr: 0.0001
        weight_decay: 1.0e-06
    decoder_strategy: ${decoder_strategy}
    every_n_steps_output: 100
    repeat_times: 2
    grad_method: norm
    lambda_adv: 1.0
    clip_epsilon: 0.2
    lambda_entropy: 0.02
    lambda_aux: 0.05
    target_entropy_beta: 0.0002
    entropy_target: 0.2
    tau: 0.005
    grad_clip: 1
    low_level_train: false
  model_checkpoint:
    _target_: EasyNCO.utils.utils.CustomModelCheckpoint
    dirpath: checkpoints
    filename: ${model}_${problem}${scale}_{epoch:02d}
    save_top_k: ${save_top_k}
    every_n_epochs: ${every_n_epochs}
  trainer:
    _target_: lightning.pytorch.Trainer
    max_epochs: ${max_epochs}
    reload_dataloaders_every_n_epochs: 1
    log_every_n_steps: ${log_every_n_steps}
    precision: ${precision}
    enable_progress_bar: ${enable_progress_bar}
  test_loader:
    model_dirpath: pretrained
    model_filename: htsp_tsp1000.ckpt
